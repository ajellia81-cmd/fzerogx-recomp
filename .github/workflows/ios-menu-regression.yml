name: Verify specific menu preview regressions privately
on:
  push:
    branches: [main]
    paths: [ios/menu-regression-request.txt]
permissions:
  contents: read
jobs:
  menus:
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      FZGX_MENU_ROUTES: gp-pause,boot-card-empty,replay-card,options-memory
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Receive owner-supplied disc privately
        env:
          ICLOUD_SOURCE_ID: ${{ secrets.ICLOUD_SOURCE_ID }}
          ICLOUD_SAVE_ID: ${{ secrets.ICLOUD_SAVE_ID }}
        run: python3 ios/fetch_private_disc.py
      - name: Generate and compile existing host game
        run: |
          mkdir -p build-private-logs
          cmake -S . -B build-host -G Ninja -DGCN_BENCH_ONLY=ON -DFZGX_IOS_INPUT_PROBE=ON -DFZGX_IOS_LOGO_PROBE=ON -DCMAKE_BUILD_TYPE=Release -DGAME_ISO="$PWD/rom/game.iso" > build-private-logs/configure.txt 2>&1
          cmake --build build-host --target fzerogx_bench --parallel 3 > build-private-logs/build.txt 2>&1
      - name: Capture Records layouts and the initial profile illustration
        run: python3 ios/probe_menu_routes.py
      - name: Audit captured canvas tags
        env:
          FZGX_CAPTURE_AUDIT: "1"
          FZGX_REQUIRE_NATIVE_UI: "1"
        run: python3 ios/tests/check_policy.py > build-private-logs/presentation-audit.txt 2>&1
      - name: Encrypt compact route logs separately
        if: always()
        run: |
          tar -czf menu-route-logs.tar.gz build-private-logs/*.txt
          openssl cms -encrypt -binary -aes256 -in menu-route-logs.tar.gz -out FZeroGX-menu-route-logs.enc -outform DER ios/delivery-public.pem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FZeroGX-encrypted-menu-route-logs
          path: FZeroGX-menu-route-logs.enc
          if-no-files-found: error
          retention-days: 1
      - name: Encrypt diagnostics
        if: always()
        run: |
          python3 ios/package_private_diagnostics.py
          openssl cms -encrypt -binary -aes256 -in private-logs.tar.gz -out FZeroGX-menu-review.enc -outform DER ios/delivery-public.pem
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FZeroGX-encrypted-menu-review
          path: FZeroGX-menu-review.enc
          if-no-files-found: error
          retention-days: 1
