name: Build iOS game (encrypted private delivery)
on:
  push:
    branches: [main]
    paths: [ios/private-build-request.txt]
  workflow_dispatch:
    inputs:
      approved_icon_sha256:
        description: SHA256 of the icon preview explicitly approved by the user
        required: true
        type: string
      probe_only:
        description: Run private scene diagnostics without building an IPA
        type: boolean
        default: false
      skip_probes:
        description: Skip repeated host frame capture after private renderer review
        type: boolean
        default: false
      runner_label:
        description: Hosted macOS runner pool
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-15]
permissions:
  contents: read
jobs:
  device:
    runs-on: ${{ inputs.runner_label || 'macos-15-intel' }}
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Reproduce approved cover-crop app icon
        env:
          APPROVED_ICON_SHA256: ${{ inputs.approved_icon_sha256 || 'bd2fe02cdf39f41f5f027bb2de447f5be6eeb47567305d11bb336bccb503e7aa' }}
        run: |
          python3 -m pip install --target build-icon-python Pillow==12.3.0
          PYTHONPATH="$PWD/build-icon-python" python3 ios/prepare_icon.py build-ios/Assets.xcassets --approved-sha256 "$APPROVED_ICON_SHA256"
      - name: Prepare private log directory
        run: mkdir -p build-private-logs
      - name: Receive user-supplied disc (never cached or uploaded)
        env:
          ICLOUD_SOURCE_ID: ${{ secrets.ICLOUD_SOURCE_ID }}
        run: python3 ios/fetch_private_disc.py
      - name: Validate supported disc and executable hash
        run: python3 gcn-recomp/recomp/extract_dol.py rom/game.iso build-private-logs/main.dol GFZE01 421c88106697d3275a3fc26fb7a01bf6d816b271 > build-private-logs/disc.txt 2>&1
      - name: Build native host bootstrap and runtime module
        shell: bash
        run: |
          cmake -S . -B build-host -G Ninja -DGCN_BENCH_ONLY=ON -DFZGX_IOS_INPUT_PROBE=ON -DCMAKE_BUILD_TYPE=Release -DGAME_ISO="$PWD/rom/game.iso" > build-private-logs/host-configure.txt 2>&1
          test -s build-host/rels-runtime/fze.main.rel
      - name: Validate real game scene and interpolation inputs (headless)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_probes }}
        shell: bash
        env:
          FZGX_PRIVATE_CAPTURE: "1"
          GCN_INPUT: "500:A:5,1300:A:5,1340:A:5,1380:A:5,1440:START:5,1500:A:5,1580:LEFT:5,1620:A:5,1800:A:5"
        run: |
          cmake --build build-host --target fzerogx_bench --parallel 3 > build-private-logs/probe-build.txt 2>&1
          mkdir -p build-probe
          cd build-probe
          ../build-host/fzerogx_bench --seconds=45 --warmup=0 "$GITHUB_WORKSPACE/rom/game.iso" > ../build-private-logs/interpolation-probe.txt 2>&1
      - name: Inspect menu to race scene transitions (headless)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_probes }}
        shell: bash
        run: |
          mkdir -p build-probe-race
          cd build-probe-race
          FZGX_PRIVATE_CAPTURE=1 GCN_INPUT="500:A:5,1300:A:5,1340:A:5,1380:A:5,1440:START:5,1500:A:5,1580:LEFT:5,1620:A:5,1800:A:5,2000:START:5,2200:A:5,2400:A:5,2600:A:5,2800:A:5,3000:A:5,3200:A:5,3400:A:5,3700:A:5,3800:A:1500,5500:START:5,5800:DOWN:5,6000:DOWN:5,6200:A:5,6400:LEFT:5,6600:A:5,7200:A:5" ../build-host/fzerogx_bench --seconds=90 --warmup=0 "$GITHUB_WORKSPACE/rom/game.iso" > ../build-private-logs/race-probe.txt 2>&1
      - name: Inspect story movie presentation inputs (headless)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_probes }}
        shell: bash
        run: |
          mkdir -p build-probe-story
          cd build-probe-story
          FZGX_PRIVATE_CAPTURE=1 GCN_INPUT="500:A:5,1300:A:5,1340:A:5,1380:A:5,1440:START:5,1500:A:5,1580:LEFT:5,1620:A:5,1800:A:5,2000:START:5,2200:DOWN:5,2400:RIGHT:5,2600:A:5,2800:A:5" ../build-host/fzerogx_bench --seconds=60 --warmup=0 "$GITHUB_WORKSPACE/rom/game.iso" > ../build-private-logs/story-probe.txt 2>&1
      - name: Encrypt renderer review before device compilation
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_probes }}
        run: |
          python3 ios/package_private_diagnostics.py
          openssl cms -encrypt -binary -aes256 -in private-logs.tar.gz -out FZeroGX-renderer-review.enc -outform DER ios/delivery-public.pem
      - name: Upload encrypted renderer review only
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.skip_probes }}
        uses: actions/upload-artifact@v4
        with:
          name: FZeroGX-encrypted-renderer-review
          path: FZeroGX-renderer-review.enc
          if-no-files-found: error
          retention-days: 1
      - name: Verify startup logo timing policy with real guest code
        if: ${{ !inputs.probe_only }}
        shell: bash
        run: |
          cmake -S . -B build-host -G Ninja -DGCN_BENCH_ONLY=ON -DFZGX_IOS_INPUT_PROBE=ON -DFZGX_IOS_LOGO_PROBE=ON -DCMAKE_BUILD_TYPE=Release -DGAME_ISO="$PWD/rom/game.iso" > build-private-logs/logo-configure.txt 2>&1
          cmake --build build-host --target fzerogx_bench --parallel 3 > build-private-logs/logo-build.txt 2>&1
          GCN_TIMESCALE=1 FZGX_LOGO_TRACE=1 build-host/fzerogx_bench --seconds=20 --warmup=0 "$PWD/rom/game.iso" > build-private-logs/logo-timing.txt 2>&1
      - name: Inspect menu compositing regressions (private headless captures)
        if: ${{ !inputs.probe_only }}
        run: python3 ios/probe_menu_routes.py
      - name: Collect observed shader and blend configurations before boot
        if: ${{ !inputs.probe_only }}
        run: |
          c++ -std=c++20 -O1 -DGCN_GL_ES -DGCN_GL_ES30 -ffunction-sections -fdata-sections -Iios -Igcn-recomp/runtime -Igcn-recomp/runtime/gx/glad_es/include ios/tools/capture_pipeline_metadata.cpp gcn-recomp/runtime/gx/shadergen.cpp -Wl,-dead_strip -o build-host/collect-pipeline-metadata
          build-host/collect-pipeline-metadata src/shader_keys.bin build-host/menu-shader-keys.bin ios/menu_pipeline_states.inc build-probe-menu-* > build-private-logs/pipeline-metadata.txt 2>&1
          cp build-host/menu-shader-keys.bin src/shader_keys.bin
      - name: Encrypt menu review before device compilation
        if: ${{ !inputs.probe_only }}
        run: |
          python3 ios/package_private_diagnostics.py
          openssl cms -encrypt -binary -aes256 -in private-logs.tar.gz -out FZeroGX-menu-review.enc -outform DER ios/delivery-public.pem
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.probe_only }}
        with:
          name: FZeroGX-encrypted-menu-review
          path: FZeroGX-menu-review.enc
          if-no-files-found: error
          retention-days: 1
      - name: Cache public ANGLE dependency only
        if: ${{ !inputs.probe_only }}
        id: angle-cache
        uses: actions/cache/restore@v4
        with:
          path: build-ios/angle
          key: angle-iphoneos-webkit-3a41ad1d-xcode26.3-${{ runner.arch }}-v3
      - name: Build ANGLE Metal for iPhoneOS
        if: ${{ !inputs.probe_only }}
        shell: bash
        run: |
          mkdir -p build-ios
          if [ ! -f build-ios/angle/libANGLE-shared.dylib ]; then
            python3 ios/build_angle.py "$PWD/build-ios/angle" > build-private-logs/angle.txt 2>&1
          fi
      - name: Configure iOS ARM64 game
        if: ${{ !inputs.probe_only }}
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DGCN_HOST_BUILD_DIR="$PWD/build-host" -DGAME_ISO="$PWD/rom/game.iso" \
            -DGCN_ANGLE_DIR="$PWD/build-ios/angle" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO > build-private-logs/ios-configure.txt 2>&1
      - name: Compile and link real game (no guest stubs)
        if: ${{ !inputs.probe_only }}
        run: python3 ios/build_device.py build-ios
      - name: Audit and package unsigned IPA
        if: ${{ !inputs.probe_only }}
        shell: bash
        run: |
          APP=$(find build-ios -path '*/Release-iphoneos/FZeroGX.app' -type d -print -quit)
          test -n "$APP"
          python3 ios/package_unsigned.py "$APP" FZeroGX-iOS-build17-unsigned.ipa
          openssl cms -encrypt -binary -aes256 -in FZeroGX-iOS-build17-unsigned.ipa -out FZeroGX-private.ipa.enc -outform DER ios/delivery-public.pem
      - name: Encrypt diagnostics for private review
        if: always()
        shell: bash
        run: |
          # Disc inputs, RELs and generated game C are deliberately excluded.
          python3 ios/package_private_diagnostics.py
          openssl cms -encrypt -binary -aes256 -in private-logs.tar.gz -out FZeroGX-build-logs.enc -outform DER ios/delivery-public.pem
      - name: Upload encrypted delivery only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FZeroGX-encrypted-private-delivery
          path: |
            FZeroGX-private.ipa.enc
            FZeroGX-build-logs.enc
          if-no-files-found: error
          retention-days: 1
      - name: Save public dependency progress, including partial builds
        if: always() && steps.angle-cache.outputs.cache-hit != 'true' && hashFiles('build-ios/angle/webkit/Source/ThirdParty/ANGLE/ANGLE.xcodeproj/project.pbxproj') != ''
        uses: actions/cache/save@v4
        with:
          path: build-ios/angle
          key: angle-iphoneos-webkit-3a41ad1d-xcode26.3-${{ runner.arch }}-v3

